
name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APKs
        run: gradle --no-daemon :app-control:assembleDebug :app-agent:assembleDebug

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: RemoteControl-debug-APKs
          path: |
            app-control/build/outputs/apk/debug/*.apk
            app-agent/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
